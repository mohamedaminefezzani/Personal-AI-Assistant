<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ─── Auth ──────────────────────────────────────────────────────────── -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <div class="auth-wordmark">
                <div class="auth-wordmark-dot"></div>
                <h1>Personal Assistant</h1>
            </div>
            <p class="auth-subtitle">Local · Private · Yours</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Sign in</button>
                <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
            </div>

            <div class="auth-error" id="authError"></div>

            <input class="auth-input" type="text" id="authUsername" placeholder="Username" autocomplete="username" />
            <input class="auth-input" type="password" id="authPassword" placeholder="Password" autocomplete="current-password" />
            <button class="auth-submit" id="authSubmit" onclick="submitAuth()">Sign in</button>
        </div>
    </div>

    <!-- ─── App ───────────────────────────────────────────────────────────── -->
    <div class="app-layout" id="appLayout" style="display:none">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Chats</span>
                <button class="new-chat-btn" id="newChatBtn" title="New conversation">＋</button>
            </div>
            <div class="conversation-list" id="conversationList"></div>
        </aside>

        <div class="main-area">
            <div class="header">
                <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
                <div class="header-wordmark">
                    <div class="header-dot"></div>
                    <h1>Assistant</h1>
                </div>
                <div class="header-right">
                    <span class="header-username" id="headerUsername"></span>
                    <button class="logout-btn" onclick="logout()">Sign out</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message assistant">
                        Ready. What are we working on?
                    </div>
                </div>

                <div class="input-area">
                    <div id="fileChips" class="file-chips"></div>
                    <div class="input-container">
                        <input type="file" id="imageInput" class="image-input"
                            accept="image/*,video/mp4,video/webm,text/plain,text/x-python,text/javascript,text/html,text/css,.ts,.go,.rs,.java,.cpp,.c,.zip"
                            multiple>
                        <button class="button image" onclick="document.getElementById('imageInput').click()" title="Attach file or image">📎</button>
                        <button class="button code-toggle" id="codeToggle" onclick="toggleCodeMode()" title="Use coding agent">💻</button>
                        <textarea id="messageInput" placeholder="Message…" rows="1"></textarea>
                        <button class="button send" id="sendButton" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
